# Canonical team registry: one entry per club. This file is the project's source of truth
# for team identity, so it lives in Git and every change is reviewed.
#
#   id       stable ASCII slug. Never rename it once data has been built on it.
#   name     the display name shown in logs and Telegram coupons.
#   country  used to scope matching, so two clubs in different countries may share a spelling.
#   aliases  every other spelling seen in a data source or bookmaker. Case, accents,
#            punctuation and tokens like "FC" are ignored when matching.
#
# Rules: a spelling may belong to only one team per country. Never add a vague alias such as
# "Real", "Union" or "Racing"; the loader refuses ambiguous spellings. When the audit
# (python -m src.entities) reports an unknown spelling, add it here by hand.

teams:
